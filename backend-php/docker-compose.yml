services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-backend-php
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-wedding}
      DB_USERNAME: ${DB_USERNAME:-wedding_user}
      DB_PASSWORD: ${DB_PASSWORD:-wedding_password}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html
      - ./src:/var/www/src

  db:
    image: mysql:8.4
    container_name: wedding-backend-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wedding}
      MYSQL_USER: ${DB_USERNAME:-wedding_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wedding_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d

volumes:
  mysql_data: